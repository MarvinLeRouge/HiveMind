name: Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Regenerate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Open or update changelog PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/changelog
          commit-message: "chore: regenerate CHANGELOG.md"
          title: "chore: update CHANGELOG.md"
          body: |
            Automated changelog update generated by [git-cliff](https://git-cliff.org) from the latest Conventional Commits on `main`.

            This PR is opened automatically and updated on every push to `main`. Merge it whenever convenient.
          labels: changelog
          add-paths: CHANGELOG.md
