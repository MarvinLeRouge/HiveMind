name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # ── Build and start the E2E stack ────────────────────────────────────────
      - name: Build E2E stack
        run: docker compose -f docker-compose.e2e.yml build

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d

      # ── Wait for database and run migrations ─────────────────────────────────
      - name: Wait for database
        run: |
          timeout 60 sh -c \
            'until docker compose -f docker-compose.e2e.yml exec -T db \
              pg_isready -U HiveMind -d HiveMind; do sleep 2; done'

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Run migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://HiveMind:password@localhost:5432/HiveMind

      - name: Seed database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://HiveMind:password@localhost:5432/HiveMind
          NODE_ENV: development
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@hivemind.test
          SEED_ADMIN_PASSWORD: E2eAdmin1!

      # ── Wait for backend to be healthy ───────────────────────────────────────
      - name: Wait for backend
        run: |
          timeout 60 sh -c \
            'until curl -s http://localhost:3000/auth/me | grep -q "Unauthorized"; \
              do sleep 2; done'

      # ── Run Playwright E2E suite ─────────────────────────────────────────────
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost
          E2E_API_URL: http://localhost/api

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
